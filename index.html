<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proteus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 界面文字由 js/i18n.js 按所选语言填入（data-i18n 等属性） -->
  <div class="app">
    <!-- 左栏：艺术图 -->
    <aside class="art-pane" id="artPane" data-i18n-title="art.title">
      <img id="artImage" alt="" hidden>
      <div class="art-placeholder" id="artPlaceholder">
        <div class="art-placeholder-icon">🖼</div>
        <div data-i18n="art.upload"></div>
        <div class="muted small" data-i18n="art.hint"></div>
      </div>
      <div class="col-resizer" id="artResizer" data-i18n-title="art.resizer"></div>
    </aside>

    <!-- 中栏：剧情 -->
    <main class="chat-pane" id="chatPane">
      <header class="chat-header">
        <select id="convSelect" data-i18n-title="conv.switch"></select>
        <button id="btnNewConv" class="btn" data-i18n="conv.new"></button>
        <button id="btnRenameConv" class="btn btn-ghost" data-i18n="conv.rename" data-i18n-title="conv.renameTitle"></button>
        <button id="btnDeleteConv" class="btn btn-ghost danger" data-i18n="conv.delete" data-i18n-title="conv.deleteTitle"></button>
      </header>

      <div class="messages-wrap">
        <div class="messages" id="messages"></div>
        <button class="jump-bottom" id="btnJumpBottom" data-i18n="msg.jumpBottom" hidden></button>
      </div>

      <footer class="composer" id="composer">
        <div class="row-resizer" id="composerResizer" data-i18n-title="input.resizer"></div>
        <div class="error-bar" id="errorBar" hidden></div>
        <div class="composer-row">
          <textarea id="input"></textarea>
          <div class="composer-buttons">
            <button id="btnSend" class="btn btn-primary" data-i18n="btn.send"></button>
            <button id="btnStop" class="btn danger" data-i18n="btn.stop" hidden></button>
            <button id="btnReply" class="btn" data-i18n="btn.reply" data-i18n-title="btn.replyTitle" hidden></button>
            <button id="btnAddGreeting" class="btn btn-ghost" data-i18n="btn.addGreeting" data-i18n-title="btn.addGreetingTitle" hidden></button>
            <button id="btnGreetingReload" class="btn" data-i18n="btn.reload" data-i18n-title="btn.reloadTitle" hidden></button>
            <button id="btnGreetingConfirm" class="btn btn-primary" data-i18n="btn.confirm" data-i18n-title="btn.confirmTitle" hidden></button>
            <button id="btnGreetingCancel" class="btn btn-small btn-ghost" data-i18n="btn.cancel" hidden></button>
          </div>
        </div>
        <div class="composer-status muted small" id="status"></div>
        <div class="composer-footer" id="footer"></div>
      </footer>
    </main>

    <!-- 右栏：设置 -->
    <aside class="settings-pane" id="settingsPane">
      <!-- 锁定的对话（来自加密世界卡）才显示 -->
      <section class="card lock-card lock-only">
        <h3 data-i18n="lock.title"></h3>
        <p class="hint" data-i18n="lock.hint"></p>
        <button class="btn btn-small" id="btnUnlock" data-i18n="lock.unlock"></button>
      </section>

      <section class="card">
        <h3 data-i18n="set.systemPrompt"></h3>
        <p class="hint" data-i18n="set.systemPromptHint"></p>
        <textarea id="systemPrompt" class="scroll-box unlockable" rows="6"></textarea>
        <div class="lock-box lock-only" data-i18n="lock.protected"></div>
        <div class="row unlockable"><button class="btn btn-small btn-ghost" id="btnResetSystem" data-i18n="set.resetDefault"></button></div>
      </section>

      <section class="card">
        <h3 data-i18n="set.world"></h3>
        <p class="hint" data-i18n="set.worldHint"></p>
        <textarea id="worldText" class="scroll-box unlockable" rows="7" data-i18n-ph="set.worldPlaceholder"></textarea>
        <div class="lock-box lock-only" data-i18n="lock.protected"></div>
        <div class="row">
          <button class="btn btn-small unlockable" id="btnUploadWorld" data-i18n="set.uploadText"></button>
          <button class="btn btn-small btn-ghost unlockable" id="btnClearWorld" data-i18n="set.clear"></button>
          <span class="muted small" id="worldCount"></span>
        </div>
      </section>

      <section class="card">
        <h3 data-i18n="set.persona"></h3>
        <p class="hint" data-i18n="set.personaHint"></p>
        <textarea id="persona" class="scroll-box" rows="5" data-i18n-ph="set.personaPlaceholder"></textarea>
        <p class="hint per-conv" data-i18n="set.perConvHint"></p>
      </section>

      <section class="card">
        <h3 data-i18n="set.memory"></h3>
        <p class="hint" data-i18n="set.memoryHint"></p>
        <div class="row nowrap stepper">
          <button class="btn btn-small" id="btnRoundsMinus" data-i18n-title="set.roundsMinus">−</button>
          <input type="number" id="rounds" min="1" max="40" step="1">
          <button class="btn btn-small" id="btnRoundsPlus" data-i18n-title="set.roundsPlus">＋</button>
          <span data-i18n="set.roundsUnit"></span>
        </div>
      </section>

      <section class="card">
        <h3 data-i18n="set.model"></h3>
        <label class="field"><span data-i18n="set.provider"></span>
          <select id="provider"></select>
        </label>
        <label class="field"><span data-i18n="set.baseUrl"></span>
          <input type="text" id="baseUrl" spellcheck="false">
        </label>
        <label class="field"><span data-i18n="set.apiKey"></span>
          <div class="row nowrap">
            <input type="password" id="apiKey" spellcheck="false" autocomplete="off" placeholder="sk-...">
            <button class="btn btn-small btn-ghost" id="btnToggleKey" data-i18n="set.show"></button>
          </div>
        </label>
        <label class="field-inline remember-keys">
          <input type="checkbox" id="rememberKeys"> <span data-i18n="set.rememberKey"></span>
        </label>
        <p class="hint" data-i18n="set.rememberKeyHint"></p>
        <label class="field"><span data-i18n="set.modelName"></span>
          <div class="row nowrap">
            <input type="text" id="model" list="modelList" spellcheck="false" data-i18n-ph="set.modelPlaceholder">
            <button class="btn btn-small btn-ghost" id="btnFetchModels" data-i18n="set.fetchModels" data-i18n-title="set.fetchModelsTitle"></button>
          </div>
          <datalist id="modelList"></datalist>
        </label>
        <label class="field"><span data-i18n="set.maxTokens"></span>
          <input type="number" id="maxTokens" min="256" step="256">
        </label>
        <div id="anthropicOptions">
          <label class="field"><span data-i18n="set.effort"></span>
            <select id="effort">
              <option value="" data-i18n="set.effortDefault"></option>
              <option value="low" data-i18n="set.effortLow"></option>
              <option value="medium" data-i18n="set.effortMedium"></option>
              <option value="high" data-i18n="set.effortHigh"></option>
            </select>
          </label>
        </div>
        <div id="openaiOptions">
          <label class="field-inline">
            <input type="checkbox" id="useTemperature"> <span data-i18n="set.temperature"></span>
            <input type="number" id="temperature" min="0" max="2" step="0.05">
          </label>
          <p class="hint" data-i18n="set.temperatureHint"></p>
        </div>
        <p class="hint" data-i18n="set.keyHint"></p>
      </section>

      <section class="card">
        <h3 data-i18n="set.art"></h3>
        <div class="row">
          <button class="btn btn-small" id="btnUploadArt" data-i18n="set.uploadImage"></button>
          <button class="btn btn-small" id="btnDownloadArt" data-i18n="set.download"></button>
          <button class="btn btn-small btn-ghost" id="btnRemoveArt" data-i18n="set.remove"></button>
        </div>
      </section>

      <section class="card">
        <h3 data-i18n="set.export"></h3>
        <div class="row">
          <button class="btn btn-small" id="btnExport" data-i18n="set.exportBtn"></button>
          <button class="btn btn-small btn-ghost" id="btnRestore" data-i18n="set.restoreBtn"></button>
        </div>
        <p class="hint" data-i18n="set.exportHint"></p>
      </section>

      <section class="card">
        <h3 data-i18n="set.localData"></h3>
        <p class="hint" data-i18n="set.clearAllHint"></p>
        <button class="btn btn-small danger" id="btnClearAll" data-i18n="set.clearAll"></button>
      </section>

      <section class="card">
        <h3 data-i18n="set.language"></h3>
        <select id="langSelect"></select>
      </section>
    </aside>
  </div>

  <!-- 隐藏的文件选择器 -->
  <input type="file" id="fileWorld" accept=".txt,.md,text/plain,text/markdown" hidden>
  <input type="file" id="fileArt" accept="image/*" hidden>
  <input type="file" id="fileRestore" accept=".json,application/json" hidden>

  <!-- 弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle"></strong>
        <button class="btn btn-small btn-ghost" id="btnModalClose" data-i18n="modal.close"></button>
      </div>
      <pre class="modal-body" id="modalBody"></pre>
    </div>
  </div>

  <div class="modal" id="dialog" hidden>
    <div class="modal-box dialog-box">
      <div class="modal-head"><strong id="dialogTitle"></strong></div>
      <div class="dialog-message" id="dialogMessage"></div>
      <div class="dialog-buttons" id="dialogButtons"></div>
    </div>
  </div>

  <div class="modal" id="pwDialog" hidden>
    <div class="modal-box dialog-box">
      <div class="modal-head"><strong id="pwTitle"></strong></div>
      <div class="dialog-message" id="pwMessage"></div>
      <div class="pw-fields">
        <label class="field"><span data-i18n="pw.password"></span>
          <input type="password" id="pw1" maxlength="64" autocomplete="new-password">
        </label>
        <label class="field" id="pw2Row"><span data-i18n="pw.repeat"></span>
          <input type="password" id="pw2" maxlength="64" autocomplete="new-password">
        </label>
        <div class="pw-error" id="pwError"></div>
      </div>
      <div class="dialog-buttons">
        <button class="btn btn-ghost" id="pwCancel" data-i18n="btn.cancel"></button>
        <button class="btn btn-primary" id="pwOk" data-i18n="pw.ok"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
