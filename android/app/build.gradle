apply plugin: 'com.android.application'

// 版本号：自动构建时用 -PappVersion=0.2.0 从标签传入，否则用 package.json 里的版本
def packageVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def appVersion = (project.findProperty('appVersion') ?: packageVersion).toString()
def versionParts = appVersion.tokenize('-')[0].tokenize('.').collect { it.toInteger() }
// versionCode 必须随版本递增：1.2.3 → 10203
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// 签名：提供了这几个环境变量就用正式密钥签名（自动构建时来自 GitHub Secrets）
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseKey = keystorePath && file(keystorePath).exists()

android {
    namespace = "io.github.ioncoman813.proteus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.ioncoman813.proteus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// 列出打进 APK 的依赖，供 scripts/third-party-notices.js 生成第三方声明：
// 每行一个，Maven 依赖为 group:name:version，本地模块为 project:<路径>
tasks.register('listReleaseDependencies') {
    def outFile = layout.buildDirectory.file('release-dependencies.txt')
    outputs.file(outFile)
    outputs.upToDateWhen { false }
    doLast {
        def result = configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult
        // 没解析出来的依赖不会出现在结果里，这时宁可失败，也不生成一份缺项的声明
        def unresolved = result.allDependencies.findAll { it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult }
        if (unresolved) throw new GradleException("Unresolved dependencies: ${unresolved*.requested.join(', ')}")
        def lines = result.allComponents.collect { c ->
            def id = c.id
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) return "${id.group}:${id.module}:${id.version}"
            if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier && id.projectPath != ':app') return "project:${id.projectPath}"
            return null
        }.findAll { it }.unique().sort()
        outFile.get().asFile.text = lines.join('\n') + '\n'
    }
}
