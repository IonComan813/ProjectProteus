# 自动打包（Windows、macOS、Linux、安卓）。
# - 推送版本标签（例如 v0.2.0），或在 GitHub 网页上发布 Release 时新建标签：
#   打包并把安装包上传到这个版本的 Release（没有就新建）。
#   版本号直接取自标签（v0.2.0 → 0.2.0），不需要改 package.json。
#   带后缀的标签（例如 v0.4.0-beta.1）是测试版：新建的 Release 标为预发布（Pre-release），
#   不会成为“最新版本”，说明开头注明是测试版。标签可以打在任何分支的提交上，用的就是那次提交的代码。
#   有 .github/release-notes/<标签>.md（例如 v0.4.0-beta.1.md）时，Release 的说明以它开头
#   （在网页上新建 Release 时也一样：推送标签触发的这次运行会把它加在最前面）。
# - 在 Actions 页面手动运行（Run workflow）：
#   · “上传到哪个 Release”留空：只打包不发布，安装包在本次运行页面的 Artifacts 里下载；
#   · 填一个已有的版本标签（例如 v0.1.0）：用所选分支的最新代码重新打包，
#     上传到这个已有的 Release，替换同名文件；Release 的标题和说明不变，只更新“构建自哪次提交”那一行。
# 每次打包前都会检查打进安装包的第三方组件的许可证（scripts/third-party-notices.js），
# 遇到不认识或不兼容的许可证时打包失败；通过后生成 THIRD_PARTY_NOTICES.txt 放进安装包。
#
# 安卓版签名：在仓库 Settings → Secrets and variables → Actions 里添加
#   ANDROID_KEYSTORE_BASE64（签名密钥文件的 base64 文本）和 ANDROID_KEYSTORE_PASSWORD（密钥密码）。
# 密钥别名必须是 proteus，密钥密码与密钥库密码相同。
# 没有添加时：只打包不发布的运行改用临时的调试密钥签名（能安装，但以后的版本无法直接覆盖更新）；
# 要发布到 Release 的运行直接失败。
#
# 更新服务器（Cloudflare R2，存储桶 projectproteus-releases）：发布到 Release 之后，同一批安装包和一个 version.json
# 也上传到 R2，软件启动时从那里检查更新（js/update.js）。标签不带后缀的放在 stable/，带后缀的（测试版）放在 beta/，
# 每个频道只保留最新的一个版本，两个频道互不覆盖；重新打包一个比频道里现有版本旧的标签时，不动那个频道。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加：
#   Secrets：R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（R2 的 API 令牌，对这个存储桶有「对象读和写」权限）
#   Variables：UPDATE_BASE_URL（存储桶的公开地址，例如 https://pub-xxxx.r2.dev 或自己的域名，结尾不带 /）
# 没有添加 Secrets 时跳过上传（只给出警告）；没有 UPDATE_BASE_URL 时，打出的安装包不检查更新。

name: Build native app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到哪个已有的 Release（填版本标签，例如 v0.1.0；留空则只打包不发布）'
        required: false
        default: ''

permissions:
  contents: read

env:
  # 要发布到的版本标签：推送标签时就是这个标签，手动运行时是填写的标签，否则为空
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
          - name: macOS
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Take the version number from the tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $RELEASE_TAG is not a version like v1.2.3"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Check licenses and write third-party notices
        run: npm run notices

      - name: Set the update server address
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        shell: bash
        run: node scripts/set-update-url.js "$UPDATE_BASE_URL"

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Work out the version number
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $RELEASE_TAG is not a version like v1.2.3"
              exit 1
            fi
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set the update server address
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: node scripts/set-update-url.js "$UPDATE_BASE_URL"

      - name: Copy the web app into the Android project
        run: npm run android:sync

      # 列出打进 APK 的依赖，检查许可证，把第三方声明放进 APK
      - name: Check licenses and write third-party notices
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon -q listReleaseDependencies
          cd ..
          node scripts/third-party-notices.js android android/app/src/main/assets/public/THIRD_PARTY_NOTICES.txt

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            # 调试版可被调试工具读出手机上的数据，签名也每次不同，不能发布给用户
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed APK to release $RELEASE_TAG."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key and later versions cannot update it in place."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: proteus
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p ../dist-android
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease -PappVersion="$APP_VERSION"
            cp app/build/outputs/apk/release/app-release.apk "../dist-android/Proteus-$APP_VERSION-android.apk"
          else
            ./gradlew --no-daemon assembleDebug -PappVersion="$APP_VERSION"
            cp app/build/outputs/apk/debug/app-debug.apk "../dist-android/Proteus-$APP_VERSION-android.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-Android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [build, android]
    if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- proteus-download-notes -->'
          # 写明安装包构建自哪次提交：重新打包时用的可能不是标签那次提交，源代码以这一行为准
          build_marker='<!-- proteus-build -->'
          build_line="$build_marker The installers on this page were built from commit [\`${GITHUB_SHA:0:7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA); that commit is their source code."
          # 这个版本专门的说明（有就放在最前面）；带后缀的标签（v0.4.0-beta.1 之类）是测试版，标为预发布
          own=".github/release-notes/$RELEASE_TAG.md"
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # 已有的 Release（例如在网页上发布的）：推送标签触发时，把下载说明接在原说明后面（只加一次），
            # 有这个版本专门的说明时放在最前面，测试版标为预发布；
            # 手动运行上传到已有 Release 时，不动标题和说明。两种情况都更新“构建自哪次提交”那一行
            body=$(gh release view "$RELEASE_TAG" --json body -q .body)
            if [ "$GITHUB_EVENT_NAME" = push ] && ! grep -qF "$marker" <<< "$body"; then
              if [ -f "$own" ]; then
                body=$(cat "$own"; printf '\n---\n'; if [ -n "${body//[[:space:]]/}" ]; then printf '\n%s\n' "$body"; fi)
              fi
              body=$(printf '%s\n\n%s\n' "$body" "$marker"; cat .github/release-notes.md)
              if [ ${#prerelease[@]} -gt 0 ]; then gh release edit "$RELEASE_TAG" --prerelease; fi
            fi
            body=$(grep -vF "$build_marker" <<< "$body" || true)
            printf '%s\n\n%s\n' "$body" "$build_line" > notes.md
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            if [ "$GITHUB_EVENT_NAME" != push ]; then
              echo "::error::Release $RELEASE_TAG does not exist. Create it on the Releases page first, or leave the field empty to only build."
              exit 1
            fi
            # 测试版不会成为“最新版本”。没有这个版本专门的说明时，测试版的说明开头加一句提示
            if [ -f "$own" ]; then
              { cat "$own"; echo; echo '---'; echo; } > notes.md
            elif [ ${#prerelease[@]} -gt 0 ]; then
              { echo '> **Test version (pre-release).** It may contain bugs. Make a "Full backup (all conversations)" before installing: it uses the same data as the regular version.'; echo; } > notes.md
            else
              : > notes.md
            fi
            { echo "$marker"; cat .github/release-notes.md; echo; echo "$build_line"; } >> notes.md
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file notes.md "${prerelease[@]}"
          fi
          # 上传安装包，同名文件直接替换
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          echo "Uploaded to https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG:"
          ls -1 artifacts

      # 上传到更新服务器（Cloudflare R2，用 S3 兼容接口）。频道里原有的文件在新的 version.json 写好之后才删除，
      # 检查更新的软件不会读到指向不存在文件的 version.json
      - name: Publish to the update server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 不支持新版 AWS CLI 默认附加的校验和
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://fe03e958078a8537f7ef143d89668385.r2.cloudflarestorage.com
          R2_BUCKET: projectproteus-releases
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set: not publishing to the update server."
            exit 0
          fi
          channel=stable
          [[ "$RELEASE_TAG" == *-* ]] && channel=beta
          dest="s3://$R2_BUCKET/$channel/"
          s3() { aws s3 --endpoint-url "$R2_ENDPOINT" "$@"; }
          # 频道里现有的版本比这次的新时不动它
          s3 cp "${dest}version.json" old-version.json --only-show-errors || rm -f old-version.json
          status=0
          node scripts/update-manifest.js artifacts "$RELEASE_TAG" version.json old-version.json || status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          if [ "$status" != 0 ]; then exit "$status"; fi
          s3 sync artifacts "$dest" --exclude version.json --only-show-errors
          s3 cp version.json "${dest}version.json" --content-type application/json --cache-control no-cache --only-show-errors
          s3 sync artifacts "$dest" --exclude version.json --delete --only-show-errors
          echo "Published $RELEASE_TAG to the $channel channel:"
          s3 ls "$dest"
