# 自动打包（Windows、macOS、Linux、安卓）。
# - 推送版本标签（例如 v0.2.0），或在 GitHub 网页上发布 Release 时新建标签：
#   打包并把安装包上传到这个版本的 Release（没有就新建）。
#   版本号直接取自标签（v0.2.0 → 0.2.0），不需要改 package.json。
# - 在 Actions 页面手动运行（Run workflow）：
#   · “上传到哪个 Release”留空：只打包不发布，安装包在本次运行页面的 Artifacts 里下载；
#   · 填一个已有的版本标签（例如 v0.1.0）：用所选分支的最新代码重新打包，
#     上传到这个已有的 Release，替换同名文件；Release 的标题和说明不变，只更新“构建自哪次提交”那一行。
# 每次打包前都会检查打进安装包的第三方组件的许可证（scripts/third-party-notices.js），
# 遇到不认识或不兼容的许可证时打包失败；通过后生成 THIRD_PARTY_NOTICES.txt 放进安装包。
#
# 安卓版签名：在仓库 Settings → Secrets and variables → Actions 里添加
#   ANDROID_KEYSTORE_BASE64（签名密钥文件的 base64 文本）和 ANDROID_KEYSTORE_PASSWORD（密钥密码）。
# 密钥别名必须是 proteus，密钥密码与密钥库密码相同。
# 没有添加时：只打包不发布的运行改用临时的调试密钥签名（能安装，但以后的版本无法直接覆盖更新）；
# 要发布到 Release 的运行直接失败。

name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到哪个已有的 Release（填版本标签，例如 v0.1.0；留空则只打包不发布）'
        required: false
        default: ''

permissions:
  contents: read

env:
  # 要发布到的版本标签：推送标签时就是这个标签，手动运行时是填写的标签，否则为空
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
          - name: macOS
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Take the version number from the tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $RELEASE_TAG is not a version like v1.2.3"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Check licenses and write third-party notices
        run: npm run notices

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Work out the version number
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $RELEASE_TAG is not a version like v1.2.3"
              exit 1
            fi
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Copy the web app into the Android project
        run: npm run android:sync

      # 列出打进 APK 的依赖，检查许可证，把第三方声明放进 APK
      - name: Check licenses and write third-party notices
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon -q listReleaseDependencies
          cd ..
          node scripts/third-party-notices.js android android/app/src/main/assets/public/THIRD_PARTY_NOTICES.txt

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            # 调试版可被调试工具读出手机上的数据，签名也每次不同，不能发布给用户
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed APK to release $RELEASE_TAG."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key and later versions cannot update it in place."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: proteus
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p ../dist-android
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease -PappVersion="$APP_VERSION"
            cp app/build/outputs/apk/release/app-release.apk "../dist-android/Proteus-$APP_VERSION-android.apk"
          else
            ./gradlew --no-daemon assembleDebug -PappVersion="$APP_VERSION"
            cp app/build/outputs/apk/debug/app-debug.apk "../dist-android/Proteus-$APP_VERSION-android.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-Android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [build, android]
    if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- proteus-download-notes -->'
          # 写明安装包构建自哪次提交：重新打包时用的可能不是标签那次提交，源代码以这一行为准
          build_marker='<!-- proteus-build -->'
          build_line="$build_marker 本页安装包构建自提交 [\`${GITHUB_SHA:0:7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA)，对应的源代码就是这次提交。"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # 已有的 Release（例如在网页上发布的）：推送标签触发时，把下载说明接在原说明后面（只加一次）；
            # 手动运行上传到已有 Release 时，不动标题和说明。两种情况都更新“构建自哪次提交”那一行
            body=$(gh release view "$RELEASE_TAG" --json body -q .body)
            if [ "$GITHUB_EVENT_NAME" = push ] && ! grep -qF "$marker" <<< "$body"; then
              body=$(printf '%s\n\n%s\n' "$body" "$marker"; cat .github/release-notes.md)
            fi
            body=$(grep -vF "$build_marker" <<< "$body" || true)
            printf '%s\n\n%s\n' "$body" "$build_line" > notes.md
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            if [ "$GITHUB_EVENT_NAME" != push ]; then
              echo "::error::Release $RELEASE_TAG does not exist. Create it on the Releases page first, or leave the field empty to only build."
              exit 1
            fi
            { echo "$marker"; cat .github/release-notes.md; echo; echo "$build_line"; } > notes.md
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
          fi
          # 上传安装包，同名文件直接替换
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          echo "Uploaded to https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG:"
          ls -1 artifacts
